{% extends 'catlibrary/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="mx-auto p-5 bg-white rounded-5 shadow-sm"
         style="max-width: 700px;">

        <h1 class="display-3 fw-bold text-center mb-4">
            Вход
        </h1>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        {{ field.label }}
                    </label>

                    <input
                        type="{{ field.field.widget.input_type }}"
                        name="{{ field.name }}"
                        class="form-control"
                        {% if field.value %}
                            value="{{ field.value }}"
                        {% endif %}>

                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">
                            {{ error }}
                        </div>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit"
                    class="btn btn-warning w-100 rounded-pill py-3 fw-semibold fs-5">
                Войти
            </button>

        </form>
    </div>
</div>
{% endblock %}
